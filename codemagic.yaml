workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - gemini_creds
      java: 17
    scripts:
      - name: Initialize and Build Android APK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle init --type basic --dsl groovy --incubating
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug || true
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
      - "**/*.apk"
