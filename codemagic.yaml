workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - gemini_creds
      java: 17
    scripts:
      - name: Set Android SDK & Setup Gradle Wrapper
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle wrapper
          chmod +x gradlew
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk

